<!DOCTYPE html>
<html lang="ti">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E1611A">
<title>DX360 ሪፖርት</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DX360 RENTAL OPS — DESIGN TOKENS
   Industrial. Doosan-inspired orange. Warm neutral surfaces.
   Flat, ledger-like. Sunlight-readable. Mobile-first.
   ============================================================ */
:root{
  /* base */
  --bg:#F2EDE3;
  --bg-deep:#E8E1D2;
  --surface:#FFFFFF;
  --surface-alt:#F7F3EA;
  --ink:#1F1A15;
  --ink-soft:#6B5F52;
  --ink-faint:#96897390;
  --border:#E0D6C2;
  --border-strong:#C9BC9E;

  /* brand (Doosan-inspired) */
  --brand:#E1611A;
  --brand-deep:#B94B0E;
  --brand-soft:#FBE4D2;
  --on-brand:#FFFFFF;

  /* semantic */
  --profit:#2E7D48;
  --profit-soft:#DDEBE1;
  --warn:#C88A14;
  --warn-soft:#F8EBC7;
  --danger:#C0392B;
  --danger-soft:#F7DDD7;
  --info:#2C5F8A;
  --info-soft:#DCE7F0;

  /* type */
  --font:'Inter','Noto Sans Ethiopic','Abyssinica SIL',system-ui,-apple-system,sans-serif;
  --font-eth:'Noto Sans Ethiopic','Inter',sans-serif;

  --text-xs:.72rem;
  --text-sm:.84rem;
  --text-base:.98rem;
  --text-md:1.06rem;
  --text-lg:1.3rem;
  --text-xl:1.65rem;
  --text-2xl:2.1rem;
  --text-3xl:2.6rem;

  /* space */
  --sp-1:.25rem; --sp-2:.5rem; --sp-3:.75rem; --sp-4:1rem;
  --sp-5:1.25rem; --sp-6:1.5rem; --sp-8:2rem; --sp-10:2.5rem; --sp-12:3rem;

  --radius:10px;
  --radius-sm:6px;
  --radius-lg:16px;
  --nav-h:64px;
  --topbar-h:56px;
  --max-w:520px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  font-size:var(--text-base);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.25}
p{margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.tnum{font-variant-numeric:tabular-nums}
::selection{background:var(--brand-soft)}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

/* ===== SHELL ===== */
#app{min-height:100%;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:40;
  min-height:var(--topbar-h);
  display:flex;align-items:center;gap:var(--sp-2);
  padding:var(--sp-2) var(--sp-3);
  background:var(--surface);
  border-bottom:1px solid var(--border);
}
.topbar .brand{
  font-weight:800;font-size:.95rem;letter-spacing:-.01em;
  color:var(--brand-deep);white-space:nowrap;
}
.topbar .proj-switch{
  display:inline-flex;align-items:center;gap:.3rem;flex:1;min-width:0;
  max-width:56vw;font-weight:700;color:var(--ink);font-size:.86rem;
  background:var(--surface-alt);border:1px solid var(--border);
  border-radius:999px;padding:.35rem .55rem .35rem .75rem;cursor:pointer;
}
.topbar .proj-switch span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .proj-switch svg{flex:none;width:14px;height:14px;transform:rotate(90deg);color:var(--ink-soft)}
.topbar .spacer{flex:1;min-width:0}
.sync-badge{
  display:inline-flex;align-items:center;gap:.35rem;flex:none;
  font-size:var(--text-xs);font-weight:600;
  padding:.28rem .55rem;border-radius:999px;border:1px solid transparent;
}
.sync-badge .dot{width:7px;height:7px;border-radius:50%;flex:none}
.sync-ok{background:var(--profit-soft);color:var(--profit)} .sync-ok .dot{background:var(--profit)}
.sync-pending{background:var(--info-soft);color:var(--info)} .sync-pending .dot{background:var(--info);animation:pulse 1.4s ease-in-out infinite}
.sync-off{background:var(--danger-soft);color:var(--danger)} .sync-off .dot{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

main{flex:1;width:100%;max-width:var(--max-w);margin:0 auto;padding:var(--sp-4) var(--sp-4) calc(var(--nav-h) + var(--sp-8));}

.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  height:var(--nav-h);display:flex;
  background:var(--surface);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
.navbtn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;
  background:none;border:none;color:var(--ink-soft);font-size:.68rem;font-weight:600;
  padding:.4rem 0;font-family:var(--font-eth);
}
.navbtn .ic{font-size:1.3rem;line-height:1;display:flex;align-items:center;justify-content:center}
.navbtn .ic svg{width:22px;height:22px;stroke-width:2}
.navbtn.active{color:var(--brand)}
.navbtn.active .ic svg{stroke:var(--brand)}

@media (min-width:900px){
  #app{flex-direction:row}
  .bottomnav{
    position:sticky;top:0;left:0;bottom:auto;height:100vh;width:220px;
    flex-direction:column;border-top:none;border-right:1px solid var(--border);
    padding:var(--sp-6) var(--sp-2);gap:var(--sp-1);
  }
  .navbtn{flex-direction:row;justify-content:flex-start;gap:.75rem;padding:.7rem .9rem;border-radius:var(--radius-sm);font-size:.9rem}
  .navbtn.active{background:var(--brand-soft)}
  main{max-width:840px;padding:var(--sp-8) var(--sp-8) var(--sp-10)}
  .topbar{padding:0 var(--sp-8)}
}
@media (min-width:1200px){
  main{max-width:1000px}
}

/* ===== COMPONENTS ===== */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:var(--sp-4);margin-bottom:var(--sp-4);
}
.card.tight{padding:var(--sp-3)}
.card.accent-l{border-left:4px solid var(--brand)}
.card.profit-l{border-left:4px solid var(--profit)}
.card.warn-l{border-left:4px solid var(--warn)}
.card.loss-l{border-left:4px solid var(--danger)}
.card.info-l{border-left:4px solid var(--info)}

.section-title{font-size:var(--text-md);font-weight:700;margin:var(--sp-6) 0 var(--sp-3);color:var(--ink)}
.section-title:first-child{margin-top:0}
.muted{color:var(--ink-soft)}
.small{font-size:var(--text-sm)}
.tiny{font-size:var(--text-xs)}

.hero-figure{display:flex;flex-direction:column;gap:.15rem}
.hero-figure .label{font-size:var(--text-sm);color:var(--ink-soft);font-weight:600}
.hero-figure .value{font-size:var(--text-3xl);font-weight:800;letter-spacing:-.015em}
.hero-figure .value.profit{color:var(--profit)}
.hero-figure .value.loss{color:var(--danger)}
.hero-figure .value.brand{color:var(--brand-deep)}
.hero-figure .sub{font-size:var(--text-sm);color:var(--ink-soft)}

.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:var(--text-xs);font-weight:700;padding:.25rem .55rem;border-radius:999px;line-height:1.4}
.badge-brand{background:var(--brand-soft);color:var(--brand-deep)}
.badge-profit{background:var(--profit-soft);color:var(--profit)}
.badge-warn{background:var(--warn-soft);color:var(--warn)}
.badge-loss{background:var(--danger-soft);color:var(--danger)}
.badge-info{background:var(--info-soft);color:var(--info)}
.badge-neutral{background:var(--surface-alt);color:var(--ink-soft);border:1px solid var(--border)}

.stat-row{display:flex;justify-content:space-between;align-items:baseline;padding:.55rem 0;border-bottom:1px solid var(--border);gap:var(--sp-3)}
.stat-row:last-child{border-bottom:none}
.stat-row .k{color:var(--ink-soft);font-size:var(--text-sm)}
.stat-row .v{font-weight:700;text-align:right}
.stat-row .v.loss{color:var(--danger)}
.stat-row .v.profit{color:var(--profit)}
.stat-row .v.warn{color:var(--warn)}

.grid-cards{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3)}
.grid-cards-3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-2)}
.mini-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:var(--sp-3)}
.mini-card .k{font-size:var(--text-xs);color:var(--ink-soft);font-weight:600}
.mini-card .v{font-size:var(--text-lg);font-weight:800;margin-top:.15rem}
.mini-card .v.loss{color:var(--danger)}
.mini-card .v.profit{color:var(--profit)}
.mini-card .v.brand{color:var(--brand-deep)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  min-height:48px;padding:.7rem 1.1rem;border-radius:var(--radius-sm);
  border:1px solid transparent;font-weight:700;font-size:var(--text-base);
  transition:background .15s ease, border-color .15s ease, opacity .15s;width:100%;
}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:active{background:var(--brand-deep)}
.btn-secondary{background:var(--surface);border-color:var(--border-strong);color:var(--ink)}
.btn-ghost{background:transparent;color:var(--brand-deep);border-color:transparent;min-height:auto;width:auto;padding:.4rem .2rem}
.btn-danger{background:var(--surface);border-color:var(--danger);color:var(--danger)}
.btn-danger-solid{background:var(--danger);color:#fff}
.btn-sm{min-height:36px;padding:.35rem .75rem;font-size:var(--text-sm);width:auto}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:var(--sp-3)}
.btn-row .btn{width:auto;flex:1}

label.field{display:block;margin-bottom:var(--sp-4)}
label.field .flabel{display:block;font-size:var(--text-sm);font-weight:600;margin-bottom:.35rem;color:var(--ink)}
label.field .fhint{display:block;font-size:var(--text-xs);color:var(--ink-soft);margin-top:.3rem}
label.field .ferr{display:block;font-size:var(--text-xs);color:var(--danger);margin-top:.3rem;font-weight:600}
.input,select.input,textarea.input{
  width:100%;min-height:48px;padding:.65rem .8rem;border-radius:var(--radius-sm);
  border:1.5px solid var(--border-strong);background:var(--surface);color:var(--ink);
}
.input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.input.err{border-color:var(--danger)}
textarea.input{min-height:88px;resize:vertical}

.list-row{
  display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);
  padding:var(--sp-3) 0;border-bottom:1px solid var(--border);
  width:100%;text-align:left;background:none;border-left:none;border-right:none;border-top:none;
}
.list-row:last-child{border-bottom:none}
.list-row .main{min-width:0;flex:1}
.list-row .title{font-weight:700;font-size:var(--text-sm)}
.list-row .meta{font-size:var(--text-xs);color:var(--ink-soft);margin-top:.15rem}
.list-row .val{font-weight:800;flex:none;text-align:right}
.list-row.tap{cursor:pointer}

.empty-state{text-align:center;padding:var(--sp-10) var(--sp-4);color:var(--ink-soft)}
.empty-state .ic{font-size:2.5rem;margin-bottom:var(--sp-3)}
.empty-state .t{font-weight:700;color:var(--ink);margin-bottom:.3rem}

.modal-backdrop{position:fixed;inset:0;background:rgba(31,26,21,.55);z-index:80;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.modal-backdrop{align-items:center}}
.modal{background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:var(--sp-5);}
@media (min-width:640px){.modal{border-radius:var(--radius-lg)}}
.modal h3{font-size:var(--text-lg);margin-bottom:var(--sp-4)}

.toast-wrap{position:fixed;top:calc(var(--topbar-h) + 10px);left:0;right:0;z-index:100;display:flex;flex-direction:column;align-items:center;gap:.5rem;pointer-events:none;padding:0 var(--sp-4)}
.toast{background:var(--ink);color:var(--surface);padding:.7rem 1.1rem;border-radius:999px;font-size:var(--text-sm);font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:100%;text-align:center}
.toast.err{background:var(--danger)} .toast.ok{background:var(--profit)}

.tab-row{display:flex;gap:.4rem;margin-bottom:var(--sp-4);overflow-x:auto;padding-bottom:.2rem}
.tab-btn{flex:none;padding:.5rem 1rem;border-radius:999px;border:1.5px solid var(--border-strong);background:var(--surface);font-weight:700;font-size:var(--text-sm);color:var(--ink-soft);white-space:nowrap}
.tab-btn.active{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.wizard-steps{display:flex;gap:.4rem;margin-bottom:var(--sp-5);overflow-x:auto;padding-bottom:.2rem}
.wizard-step-dot{
  flex:none;min-width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:var(--text-sm);font-weight:700;background:var(--surface-alt);color:var(--ink-soft);border:1.5px solid var(--border);
}
.wizard-step-dot.done{background:var(--profit);color:#fff;border-color:var(--profit)}
.wizard-step-dot.current{background:var(--brand);color:#fff;border-color:var(--brand)}
.wizard-title{font-size:var(--text-lg);font-weight:800;margin-bottom:.2rem}
.wizard-sub{color:var(--ink-soft);font-size:var(--text-sm);margin-bottom:var(--sp-5)}
.live-calc{display:flex;justify-content:space-between;align-items:center;background:var(--brand-soft);border-radius:var(--radius-sm);padding:.75rem 1rem;margin-top:var(--sp-2)}
.live-calc .k{font-size:var(--text-sm);font-weight:600;color:var(--brand-deep)}
.live-calc .v{font-size:var(--text-lg);font-weight:800;color:var(--brand-deep)}

.switch{position:relative;width:46px;height:27px;flex:none;display:inline-block}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:1}
.switch .track{position:absolute;inset:0;background:var(--border-strong);border-radius:999px;transition:background .15s}
.switch .thumb{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked + .track{background:var(--brand)}
.switch input:checked ~ .thumb{transform:translateX(19px)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-3) 0;border-bottom:1px solid var(--border);gap:var(--sp-3)}
.toggle-row:last-child{border-bottom:none}

.login-wrap{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:var(--sp-6);max-width:420px;margin:0 auto;width:100%}
.login-mark{display:inline-block;font-size:1.05rem;font-weight:800;color:var(--brand-deep);letter-spacing:.02em;padding-bottom:var(--sp-2);border-bottom:2px solid var(--brand);margin-bottom:var(--sp-6);font-family:var(--font-eth)}
.login-title{font-size:var(--text-xl);font-weight:800;margin-bottom:.3rem;font-family:var(--font-eth)}
.login-sub{color:var(--ink-soft);margin-bottom:var(--sp-6);font-family:var(--font-eth)}

.skeleton{background:linear-gradient(90deg,var(--surface-alt) 25%,var(--border) 37%,var(--surface-alt) 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:var(--radius-sm);height:1rem}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* Timeline (daily operations) */
.timeline{position:relative;padding-left:var(--sp-6)}
.timeline::before{content:'';position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl-item{position:relative;padding:0 0 var(--sp-4) var(--sp-4);display:flex;justify-content:space-between;gap:var(--sp-3);align-items:flex-start}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:'';position:absolute;left:-4px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:2.5px solid var(--border-strong);z-index:1}
.tl-item.work::before{border-color:var(--profit);background:var(--profit-soft)}
.tl-item.break::before{border-color:var(--warn);background:var(--warn-soft)}
.tl-item.lunch::before{border-color:var(--info);background:var(--info-soft)}
.tl-item.repair::before{border-color:var(--danger);background:var(--danger-soft)}
.tl-item.other::before{border-color:var(--ink-soft)}
.tl-time{font-size:var(--text-sm);font-weight:700;font-variant-numeric:tabular-nums;min-width:60px}
.tl-body{flex:1;min-width:0}
.tl-label{font-weight:700;font-size:var(--text-sm)}
.tl-meta{font-size:var(--text-xs);color:var(--ink-soft);margin-top:.15rem}
.tl-dur{font-weight:700;font-size:var(--text-sm);font-variant-numeric:tabular-nums}

/* Maintenance-specific */
.maint-hero{display:flex;flex-direction:column;gap:var(--sp-2);align-items:flex-start}
.maint-hours{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rule-row{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--sp-3);padding:var(--sp-3) 0;border-bottom:1px solid var(--border)}
.rule-row:last-child{border-bottom:none}
.rule-row .body{flex:1;min-width:0}
.rule-row .comp{font-weight:700;font-size:var(--text-sm)}
.rule-row .act{font-size:var(--text-xs);color:var(--ink-soft);margin-top:.15rem}
.rule-row .due{font-size:var(--text-xs);font-weight:700;margin-top:.2rem;font-variant-numeric:tabular-nums}

.check-row{display:flex;align-items:flex-start;gap:var(--sp-3);padding:var(--sp-3) 0;border-bottom:1px solid var(--border);cursor:pointer}
.check-row:last-child{border-bottom:none}
.check-row input[type=checkbox]{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--brand)}
.check-row .body{flex:1;min-width:0}

@media (min-width:700px){
  .grid-cards{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>

/* ---------- 4. Utilities ---------- */
function round1(n){ return Math.round((Number(n)||0)*10)/10; }
function round2(n){ return Math.round((Number(n)||0)*100)/100; }
function fmtNum(n, dec){
  const v = Number(n)||0;
  return v.toLocaleString('en-US', { maximumFractionDigits: dec==null?2:dec, minimumFractionDigits:0 });
}
function fmtBirr(n){ return fmtNum(round2(n)) + ' ' + T.birr; }
function todayDateId(d){
  d = d || new Date();
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function dateIdToDate(id){ const [y,m,d]=id.split('-').map(Number); return new Date(y,m-1,d); }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function timeToMinutes(t){
  if (!t || typeof t !== 'string') return null;
  const m = t.match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return null;
  return parseInt(m[1])*60 + parseInt(m[2]);
}
/* Cross-midnight aware duration in hours between two HH:MM times.
   If end <= start, rolls into next day. */
function sessionDurationHours(start, end){
  const s = timeToMinutes(start), e = timeToMinutes(end);
  if (s == null || e == null) return 0;
  let diff = e - s;
  if (diff <= 0) diff += 24*60;
  return round2(diff / 60);
}
function nowHHMM(){
  const d = new Date();
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function normalizePhoneToEmail(raw){
  let p = String(raw||'').replace(/[^0-9]/g,'');
  if (p.startsWith('251')) p = p.slice(3);
  if (p.startsWith('0')) p = p.slice(1);
  return `${COUNTRY_CODE}${p}@${SYNTHETIC_AUTH_DOMAIN}`;
}
function isValidLocalPhone(raw){
  const p = String(raw||'').replace(/[^0-9]/g,'');
  return /^0[79][0-9]{8}$/.test(p);
}
function mapError(err){
  const code = (err && err.code) || '';
  if (code.includes('wrong-password') || code.includes('invalid-credential')) return T.errWrongPassword;
  if (code.includes('user-not-found')) return T.errUserNotFound;
  if (code.includes('too-many-requests')) return T.errTooManyRequests;
  if (code.includes('permission-denied')) return T.errPermission;
  if (code.includes('unavailable') || code.includes('network')) return T.errNetwork;
  if (!navigator.onLine) return T.errOffline;
  return T.errUnexpected;
}

  onAuthStateChanged(auth, async (user) => {

      state.profileLoaded = false;
      onReady(false);

  const payload = {

    date: Timestamp.fromDate(dateObj),
    sessions: draft.sessions.map(s => ({
      type:s.type,
      startTime:s.startTime, endTime:s.endTime,
      duration: sessionDurationHours(s.startTime, s.endTime),
      notes: s.notes || ''
    })),
    totalProductiveHours: totals.productive,
    totalNonProductiveHours: totals.nonProductive,
    hourMeterStart: Number(draft.hourMeterStart)||0,
    hourMeterEnd: Number(draft.hourMeterEnd)||0,
    status: 'submitted',
    submittedBy: state.authUser.uid,

  };
  const commitPromise = setDoc(ref, payload);
  return { ref, payload, commitPromise };
}

  let productive = 0, nonProductive = 0;
  for (const s of (sessions||[])){

    else nonProductive += h;
  }
  return { productive: round2(productive), nonProductive: round2(nonProductive) };

/* ---------- 12. Maintenance engine ----------
   Evaluates independent maintenance rules against current hour meter
   and completion history. Returns per-rule status:
     due    — should be done at or before now
     overdue — passed due without completion
     ok      — not yet due
   No checklist consolidation: each rule evaluated independently. */
function ruleAppliesTo(rule, machine){
  if (rule.optional){
    const att = machine.attachment || 'standard';
    if (rule.id === 'breaker_filter' && att !== 'breaker') return false;
    if (rule.id === 'air_comp_filter' && att !== 'breaker') return false;
    if (rule.id === 'oil_bath_pre' && att === 'standard') return false;
  }
  return true;
}
function lastCompletion(rule, events){
  let latest = null;
  for (const ev of events){
    for (const act of (ev.completedActions||[])){
      if (act.ruleId === rule.id){
        const h = Number(ev.hourMeterAfter||0);
        if (latest == null || h > latest) latest = h;
      }
    }
  }
  return latest;
}
function evaluateRule(rule, machine, events){
  const cur = Number(machine.currentHours)||0;
  const last = lastCompletion(rule, events);
  const result = {
    rule, currentHours: cur, lastCompletedAt: last,
    nextDue:null, status:'ok', reason:''
  };
  const applyRecurring = (base) => {
    if (last == null){
      // never completed → due at first interval
      result.nextDue = base;
    } else {
      result.nextDue = last + base;
    }
  };
  switch(rule.ruleType){
    case 'recurring': {
      applyRecurring(rule.intervalHours);
      if (cur >= result.nextDue){
        // grace: if within 10% of interval past due, mark due; else overdue
        const grace = rule.intervalHours * 0.1;
        if (cur - result.nextDue > grace) result.status = 'overdue';
        else result.status = 'due';
      }
      break;
    }
    case 'first_then_recur': {
      if (last == null){
        result.nextDue = rule.firstTimeHours;
      } else if (last < rule.firstTimeHours){
        result.nextDue = rule.firstTimeHours;
      } else {
        // find next milestone above last
        const first = rule.firstTimeHours;
        const k = Math.floor((last - first) / rule.intervalHours) + 1;
        result.nextDue = first + k * rule.intervalHours;
      }
      if (cur >= result.nextDue){
        const grace = rule.intervalHours * 0.1;
        result.status = (cur - result.nextDue > grace) ? 'overdue' : 'due';
      }
      break;
    }
    case 'break_in': {
      // Applies only up to breakInUntilHours.
      if (cur > rule.breakInUntilHours){
        result.status = 'ok';
        result.reason = 'Break-in window passed';
        result.nextDue = null;
        break;
      }
      if (last == null){
        result.nextDue = rule.intervalHours;
      } else {
        result.nextDue = last + rule.intervalHours;
      }
      if (cur >= result.nextDue){
        result.status = 'due';
      }
      break;
    }
    case 'break_in_then_recur': {
      if (cur <= rule.breakInUntilHours){
        // during break-in: every breakInIntervalHours
        if (last == null) result.nextDue = rule.breakInIntervalHours;
        else result.nextDue = last + rule.breakInIntervalHours;
        if (cur >= result.nextDue) result.status = 'due';
      } else {
        if (last == null || last <= rule.breakInUntilHours){
          // first regular interval starts after break-in
          result.nextDue = rule.intervalHours;
        } else {
          const k = Math.floor((last - rule.intervalHours) / rule.intervalHours) + 1;
          result.nextDue = k * rule.intervalHours;
        }
        if (cur >= result.nextDue){
          const grace = rule.intervalHours * 0.1;
          result.status = (cur - result.nextDue > grace) ? 'overdue' : 'due';
        }
      }
      break;
    }
  }
  return result;
}
function evaluateMachineMaintenance(machine, events){
  const applicable = MAINTENANCE_RULES.filter(r => ruleAppliesTo(r, machine));
  return applicable.map(r => evaluateRule(r, machine, events));
}

/* ---------- 13. Billing ---------- */
/* Only APPROVED productive Work Session hours are billable. */
function computeMachineBilling(machine, dailyLogs){
  let productiveHours = 0, nonProductiveHours = 0, billableHours = 0;
  for (const log of dailyLogs){
    if (log.status !== 'approved') continue;
    const p = Number(log.totalProductiveHours)||0;
    const np = Number(log.totalNonProductiveHours)||0;
    productiveHours += p;
    nonProductiveHours += np;
    billableHours += p;
  }
  const rate = Number(machine.rentalRate)||0;
  return {
    productiveHours: round2(productiveHours),
    nonProductiveHours: round2(nonProductiveHours),
    billableHours: round2(billableHours),
    rentalRate: rate,
    rentalAmount: round2(billableHours * rate)
  };
}

  el.innerHTML = `<span class="dot"></span>${s==='ok'?T.syncOk:s==='pending'?T.syncPending:T.syncOff}`;

function trackDocSync(ref){
  state.pendingWrites = true;
  updateSyncBadge();
  const unsub = onSnapshot(ref, { includeMetadataChanges:true }, (snap) => {
    if (!snap.metadata.hasPendingWrites){
      state.pendingWrites = false;
      updateSyncBadge();
      unsub();
    }
  }, () => unsub());
}
function syncBadgeHtml(){
  const s = !state.online ? 'off' : (state.pendingWrites ? 'pending' : 'ok');
  const cls = s==='ok'?'sync-ok':s==='pending'?'sync-pending':'sync-off';
  const label = s==='ok'?T.syncOk:s==='pending'?T.syncPending:T.syncOff;
  return `<span class="sync-badge ${cls}" id="syncBadge"><span class="dot"></span>${label}</span>`;
}

/* ---------- 15. Router ---------- */
function navigate(view, params){
  state.view = view;
  state.viewParams = params || {};
  renderApp();
  window.scrollTo(0,0);
}
async function renderApp(){
  if (state.view === 'login'){
    ROOT.innerHTML = renderLogin();
    bindLogin();
    return;
  }
  if (!document.getElementById('main')){
    ROOT.innerHTML = `<div class="topbar" id="topbar"></div><main id="main"></main><nav class="bottomnav" id="bottomnav"></nav>`;
  }
  renderTopbar();
  renderBottomNav();
  const main = document.getElementById('main');
  const token = ++renderApp._t || (renderApp._t = 1);
  main.innerHTML = `<div class="card"><div class="skeleton" style="height:80px;margin-bottom:12px"></div><div class="skeleton" style="height:14px;width:60%"></div></div>`;
  try{
    const html = await buildView(state.view, state.viewParams);
    if (renderApp._t !== token) return;
    main.innerHTML = html;
    await mountView(state.view, state.viewParams);
  }catch(e){
    console.error(e);
    if (renderApp._t !== token) return;
    main.innerHTML = `<div class="empty-state"><div class="ic">⚠️</div><div class="t">${escapeHtml(mapError(e))}</div></div>`;
  }
}
function renderTopbar(){
  const topbar = document.getElementById('topbar');
  const proj = state.currentProjectId ? state.projects[state.currentProjectId] : null;
  const multi = myProjectIds().length > 1;
  const label = proj ? proj.name : (isAdmin() ? T.allProjects : '');
  topbar.innerHTML = `
    <div class="brand">${T.appName}</div>
    ${multi
      ? `<button class="proj-switch" id="projSwitch"><span>${escapeHtml(label)}</span>${IC.chev}</button>`
      : `<div class="proj-switch" style="cursor:default"><span>${escapeHtml(label)}</span></div>`}
    <div class="spacer"></div>
    ${syncBadgeHtml()}
  `;
  if (multi) document.getElementById('projSwitch').onclick = openProjectSwitcher;
}
function openProjectSwitcher(){
  const ids = myProjectIds();
  const rows = ids.map(pid => {
    const p = state.projects[pid];
    if (!p) return '';
    return `<button class="list-row tap" data-pid="${pid}">
      <div class="main"><div class="title">${escapeHtml(p.name)}</div><div class="meta">${p.status||'active'}</div></div>
      ${state.currentProjectId===pid?IC.check:''}
    </button>`;
  }).join('');
  const allBtn = isAdmin() ? `<button class="list-row tap" data-pid="__all__">
    <div class="main"><div class="title">${T.allProjects}</div></div>
    ${!state.currentProjectId?IC.check:''}
  </button>` : '';
  openModal(`<h3>${T.chooseProject}</h3>${allBtn}${rows}`, el => {
    el.querySelectorAll('[data-pid]').forEach(b => b.onclick = () => {
      state.currentProjectId = b.dataset.pid === '__all__' ? null : b.dataset.pid;
      closeModal();
      navigate('dashboard');
    });

}
function renderBottomNav(){
  const nav = document.getElementById('bottomnav');
  const items = [{ key:'dashboard', label:T.navDash, icon:IC.dash }];
  if (isManager()){
    items.push({ key:'today', label:T.navToday, icon:IC.today });
  }
  items.push({ key:'maintenance', label:T.navMaint, icon:IC.maint });
  if (isAdmin()){
    items.push({ key:'approvals', label:T.navApprovals, icon:IC.appr });
  }
  items.push({ key:'reports', label:T.navReports, icon:IC.reports });
  items.push({ key:'more', label:T.navMore, icon:IC.more });
  nav.innerHTML = items.map(it => `
    <button class="navbtn ${state.view===it.key?'active':''}" data-nav="${it.key}">
      <span class="ic">${it.icon}</span><span>${it.label}</span>
    </button>
  `).join('');
  nav.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => navigate(b.dataset.nav));

async function buildView(view, params){
  switch(view){
    case 'dashboard': return renderDashboard();
    case 'today': return renderToday();
    case 'maintenance': return renderMaintenance();
    case 'approvals': return renderApprovals();
    case 'reports': return renderReports();
    case 'more': return renderMore();
    case 'machineDetail': return renderMachineDetail(params);
    case 'dailyLogDetail': return renderDailyLogDetail(params);
    case 'adminProjects': return renderAdminProjects();
    case 'adminProjectEdit': return renderAdminProjectEdit(params);
    case 'adminMachines': return renderAdminMachines();
    case 'adminMachineEdit': return renderAdminMachineEdit(params);
    case 'adminUsers': return renderAdminUsers();
    case 'adminAudit': return renderAdminAudit();
    default: return `<div class="empty-state"><div class="t">404</div></div>`;
  }
}
async function mountView(view, params){
  switch(view){
    case 'dashboard': return mountDashboard();
    case 'today': return mountToday();
    case 'maintenance': return mountMaintenance();
    case 'approvals': return mountApprovals();
    case 'reports': return mountReports();
    case 'more': return mountMore();
    case 'machineDetail': return mountMachineDetail(params);
    case 'dailyLogDetail': return mountDailyLogDetail(params);
    case 'adminProjects': return mountAdminProjects();
    case 'adminProjectEdit': return mountAdminProjectEdit(params);
    case 'adminMachines': return mountAdminMachines();
    case 'adminMachineEdit': return mountAdminMachineEdit(params);
    case 'adminUsers': return mountAdminUsers();
    case 'adminAudit': return mountAdminAudit();
  }
}

function renderLogin(){
  return `

    <div class="login-sub">${T.loginSub}</div>
    <label class="field">
      <span class="flabel">${T.phoneLabel}</span>
      <input class="input tnum" id="loginPhone" type="tel" inputmode="numeric" placeholder="09XXXXXXXX" autocomplete="tel">
      <span class="ferr" id="phoneErr" style="display:none"></span>
    </label>
    <label class="field">
      <span class="flabel">${T.passwordLabel}</span>
      <input class="input" id="loginPassword" type="password" autocomplete="current-password">
    </label>
    <button class="btn btn-primary" id="loginBtn">${T.loginBtn}</button>
  </div>`;
}
function bindLogin(){
  const btn = document.getElementById('loginBtn');
  const phoneEl = document.getElementById('loginPhone');
  const passEl = document.getElementById('loginPassword');
  const submit = async () => {
    const phone = phoneEl.value.trim();
    const pass = passEl.value;
    const errEl = document.getElementById('phoneErr');
    if (!isValidLocalPhone(phone)){
      errEl.style.display = 'block';
      errEl.textContent = T.phoneHint;
      return;
    }
    errEl.style.display = 'none';
    if (!pass){ toast(T.required, 'err'); return; }
    btn.disabled = true; btn.textContent = T.loggingIn;
    try{
      await doLogin(phone, pass);
    }catch(e){
      console.error(e);
      toast(mapError(e), 'err');
      btn.disabled = false; btn.textContent = T.loginBtn;
    }
  };
  btn.onclick = submit;
  passEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
}

/* ---------- 17. Dashboard ---------- */
function machineStatusBadge(m, maintResults){
  const overdue = (maintResults||[]).some(r => r.status === 'overdue');
  const due = (maintResults||[]).some(r => r.status === 'due');
  if (m.status === 'down' || overdue) return `<span class="badge badge-loss">${T.maintOverdue}</span>`;
  if (due) return `<span class="badge badge-warn">${T.maintDue}</span>`;
  if (m.status === 'active') return `<span class="badge badge-profit">${T.mStatActive}</span>`;
  return `<span class="badge badge-neutral">${T.mStatIdle}</span>`;
}

  if (!state.currentProjectId){
    return `<div class="empty-state"><div class="ic">🚜</div><div class="t">ናብ ዝኾነ ፕሮጀክት ኣይተመደብኩምን</div></div>`;

function sessionIcon(type){
  return { work:'🔧', break:'☕', lunch:'🍽️', repair:'🛠️', other:'⏸️' }[type] || '•';
}
function sessionLabel(type){
  return { work:T.opWork, break:T.opBreak, lunch:T.opLunch, repair:T.opRepair, other:T.opOther }[type] || type;
}
async function renderToday(){
  if (Object.keys(state.machines).length === 0) await fetchMachines();
  const ids = myProjectIds();
  const machines = Object.values(state.machines).filter(m => ids.includes(m.projectId) && m.active !== false);
  if (machines.length === 0) return `<div class="empty-state"><div class="ic">🚜</div><div class="t">${T.errNoMachine}</div></div>`;

  // Pick machine
  if (!state.currentMachineId || !machines.find(m=>m.id===state.currentMachineId)){
    state.currentMachineId = machines[0].id;
  }
  const machine = state.machines[state.currentMachineId];
  const dateId = todayDateId();

  // Load or initialize draft
  if (!state.dailyDraft || state.dailyDraft.machineId !== machine.id || state.dailyDraft.dateId !== dateId){
    const existing = await fetchDailyLog(machine.id, dateId);
    if (existing){
      if (existing.status !== 'submitted' && existing.status !== 'rejected'){
        state.dailyDraft = null;
        return renderDailyLogSummary(machine, existing);
      }
      if (existing.status === 'submitted' || existing.status === 'approved'){
        state.dailyDraft = null;
        return renderDailyLogSummary(machine, existing);
      }
      state.dailyDraft = {
        machineId: machine.id, dateId,
        sessions: existing.sessions || [],
        hourMeterStart: existing.hourMeterStart || machine.currentHours,
        hourMeterEnd: existing.hourMeterEnd || machine.currentHours,
        existingRejected: existing.status === 'rejected',
        rejectedReason: existing.rejectedReason || ''
      };
    } else {
      state.dailyDraft = {
        machineId: machine.id, dateId,
        sessions: [],
        hourMeterStart: machine.currentHours || 0,
        hourMeterEnd: machine.currentHours || 0
      };
    }
  }
  const d = state.dailyDraft;
  const totals = computeDayTotals(d.sessions);

  const machineSelect = machines.length > 1 ? `
    <label class="field" style="margin-bottom:var(--sp-3)">
      <span class="flabel">${T.adminMachines}</span>
      <select class="input" id="todayMachine">
        ${machines.map(m => `<option value="${m.id}" ${m.id===machine.id?'selected':''}>${escapeHtml(m.model)} ${m.serial?'· '+escapeHtml(m.serial):''}</option>`).join('')}
      </select>
    </label>` : '';

  const timeline = d.sessions.length ? `
    <div class="timeline">
      ${d.sessions.map((s, i) => `
        <div class="tl-item ${s.type}">
          <div class="tl-time tnum">${s.startTime}</div>
          <div class="tl-body">
            <div class="tl-label">${sessionIcon(s.type)} ${sessionLabel(s.type)}</div>
            <div class="tl-meta">${s.startTime} → ${s.endTime}${sessionDurationHours(s.endTime, s.startTime) > 0 && s.endTime <= s.startTime ? ' '+T.opOvernightNote : ''}${s.notes ? ' · '+escapeHtml(s.notes) : ''}</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:.3rem">
            <div class="tl-dur tnum">${fmtNum(sessionDurationHours(s.startTime, s.endTime),1)}h</div>
            <button class="btn-ghost" data-rmidx="${i}" style="color:var(--danger);font-size:.75rem">${T.remove}</button>
          </div>
        </div>
      `).join('')}
    </div>
  ` : `<div class="empty-state small" style="padding:var(--sp-6) var(--sp-4)">${T.opNoSessions}</div>`;

  return `
    ${machineSelect}
    ${d.existingRejected ? `<div class="card loss-l"><div class="tiny" style="color:var(--danger);font-weight:700">${T.statusRejected}</div><div class="small" style="margin-top:.3rem">${escapeHtml(d.rejectedReason)}</div></div>` : ''}
    <div class="card accent-l">
      <div class="hero-figure">
        <span class="label">${T.opTotalProductive}</span>
        <span class="value brand tnum">${fmtNum(totals.productive,1)} <span style="font-size:1rem">${T.hours}</span></span>
        <span class="sub">${T.opTotalNonProductive}: ${fmtNum(totals.nonProductive,1)}h</span>
      </div>
    </div>
    <div class="card" style="padding:0 var(--sp-4)">
      <div class="stat-row">
        <span class="k">${T.opHourMeter} (${T.maintCurrent})</span>
        <span class="v tnum">${fmtNum(machine.currentHours,1)}h</span>
      </div>
      <label class="field" style="padding:var(--sp-3) 0;margin:0">
        <span class="flabel">${T.opHourMeter} — ${T.opEndOfDay}</span>
        <input class="input tnum" id="hourEnd" type="number" min="0" step="0.1" inputmode="decimal" value="${d.hourMeterEnd||''}">
      </label>
    </div>
    <div class="section-title">${T.opToday}</div>
    <div class="card" style="padding:var(--sp-4)">
      ${timeline}
    </div>

      <button class="btn btn-secondary btn-sm" data-add="work">+ ${T.opWork}</button>
      <button class="btn btn-secondary btn-sm" data-add="break">+ ${T.opBreak}</button>
      <button class="btn btn-secondary btn-sm" data-add="lunch">+ ${T.opLunch}</button>
      <button class="btn btn-secondary btn-sm" data-add="repair">+ ${T.opRepair}</button>
      <button class="btn btn-secondary btn-sm" data-add="other">+ ${T.opOther}</button>
    </div>
    ${d.sessions.length ? `<button class="btn btn-primary" id="submitDaily">${T.opSubmit}</button>` : ''}
  `;

async function mountToday(){
  const machineSel = document.getElementById('todayMachine');
  if (machineSel) machineSel.onchange = () => { state.currentMachineId = machineSel.value; state.dailyDraft = null; navigate('today'); };

  document.querySelectorAll('[data-add]').forEach(b => b.onclick = () => openAddSessionModal(b.dataset.add));
  document.querySelectorAll('[data-rmidx]').forEach(b => b.onclick = () => {
    state.dailyDraft.sessions.splice(Number(b.dataset.rmidx),1);
    navigate('today');
  });
  const endInput = document.getElementById('hourEnd');
  if (endInput) endInput.onchange = () => { state.dailyDraft.hourMeterEnd = Number(endInput.value)||0; };

  const submitBtn = document.getElementById('submitDaily');
  if (submitBtn) submitBtn.onclick = () => {
    const d = state.dailyDraft;
    if (!d.sessions.length){ toast(T.opNoSessions, 'err'); return; }
    confirmDialog(T.opSubmit, T.opSubmitConfirm, async () => {
      const machine = state.machines[d.machineId];
      try{
        // If existing rejected, remove first
        if (d.existingRejected){
          await deleteDoc(doc(db,'machines',d.machineId,'dailyLogs',d.dateId));
        }
        const { ref, commitPromise } = await submitDailyLog(d.machineId, d.dateId, machine, d);
        trackDocSync(ref);
        if (navigator.onLine){
          try{ await commitPromise; }
          catch(e){ console.error(e); toast(mapError(e),'err'); return; }
          toast(T.opSubmitted, 'ok');
          state.dailyDraft = null;
          navigate('dashboard');
        } else {
          toast(T.syncPending, 'ok');
          state.dailyDraft = null;
          navigate('dashboard');
          commitPromise.catch(e => { console.error(e); toast(mapError(e),'err'); });
        }
      }catch(e){

      }
    });
  };
  const resub = document.getElementById('resubmitBtn');
  if (resub) resub.onclick = () => { state.dailyDraft = null; navigate('today'); };
}

async function renderReports(){
  if (Object.keys(state.machines).length === 0) await fetchMachines();
  const ids = myProjectIds();
  const machines = Object.values(state.machines).filter(m => ids.includes(m.projectId) && m.active !== false);
  if (machines.length === 0) return `<div class="empty-state"><div class="t">${T.errNoMachine}</div></div>`;
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), 1);
  const end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23,59,59);
  let totalProd = 0, totalNonProd = 0, totalBillable = 0, totalRental = 0;
  const rows = [];
  for (const m of machines){
    const logs = await fetchMachineDailyLogsInRange(m.id, start, end);
    const b = computeMachineBilling(m, logs);
    totalProd += b.productiveHours;
    totalNonProd += b.nonProductiveHours;
    totalBillable += b.billableHours;
    totalRental += b.rentalAmount;
    rows.push({ m, b, logCount: logs.length });
  }
  return `
    <div class="card accent-l">
      <div class="hero-figure">
        <span class="label">${T.billRentalAmount} · ${T.periodMonth||'ወርሒ'}</span>
        <span class="value brand tnum">${fmtBirr(totalRental)}</span>
        <span class="sub">${rows.length} ${T.dashMachines}</span>
      </div>
    </div>
    <div class="grid-cards">
      <div class="mini-card"><div class="k">${T.billProductiveHours}</div><div class="v tnum">${fmtNum(totalProd,1)}h</div></div>
      <div class="mini-card"><div class="k">${T.opTotalNonProductive}</div><div class="v tnum">${fmtNum(totalNonProd,1)}h</div></div>

async function mountReports(){

/* ---------- 24. More ---------- */
async function renderMore(){

    links = `
      <div class="section-title">${T.adminSection}</div>
      <div class="card" style="padding:0 var(--sp-4)">
        ${moreLink('adminProjects', T.adminProjects)}
        ${moreLink('adminMachines', T.adminMachines)}
        ${moreLink('adminUsers', T.adminUsers)}
        ${moreLink('adminAudit', T.adminAudit)}
      </div>`;
  }
  return `
    <div class="section-title">${T.profileSection}</div>
    <div class="card">
      <div class="stat-row"><span class="k">${T.userName}</span><span class="v">${escapeHtml(p.name||'')}</span></div>
      <div class="stat-row"><span class="k">${T.userPhone}</span><span class="v tnum">0${escapeHtml(p.phone||'')}</span></div>
      <div class="stat-row"><span class="k">${T.userRole}</span><span class="v">${roleLabel}</span></div>

function moreLink(key, label){
  return `<button class="list-row tap" data-goto="${key}">
    <div class="main"><div class="title">${label}</div></div>${IC.chev}
  </button>`;
}
async function mountMore(){
  document.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => navigate(b.dataset.goto));
  const lo = document.getElementById('logoutBtn');
  if (lo) lo.onclick = () => confirmDialog(T.logout, T.logoutConfirm, doLogout, T.logout);
}

/* ---------- 25. Admin: Projects ---------- */
async function renderAdminProjects(){
  if (!isAdmin()) return `<div class="empty-state"><div class="t">${T.errPermission}</div></div>`;
  if (Object.keys(state.projects).length === 0) await fetchProjects();
  const list = Object.values(state.projects).sort((a,b)=>a.name.localeCompare(b.name));
  return `
    <button class="btn btn-primary" id="newProj" style="margin-bottom:var(--sp-4)">${T.newProject}</button>
    <div class="card" style="padding:0 var(--sp-4)">
      ${list.map(p => `
        <button class="list-row tap" data-editp="${p.id}">
          <div class="main">
            <div class="title">${escapeHtml(p.name)}</div>
            <div class="meta">${escapeHtml(p.location||'')} · ${p.status||'active'}</div>
          </div>
          ${IC.chev}
        </button>
      `).join('') || `<div class="empty-state small">${T.dashNoRecords}</div>`}
    </div>
  `;
}
async function mountAdminProjects(){
  document.getElementById('newProj').onclick = () => navigate('adminProjectEdit', { projectId: null });
  document.querySelectorAll('[data-editp]').forEach(b => b.onclick = () => navigate('adminProjectEdit', { projectId: b.dataset.editp }));
}
async function renderAdminProjectEdit(params){
  const p = params.projectId ? state.projects[params.projectId] : { name:'', location:'', client:'', status:'active', notes:'' };
  return `
    <div class="wizard-title">${params.projectId ? T.edit : T.newProject}</div>
    <div class="card">
      <label class="field"><span class="flabel">${T.projectName}</span>
        <input class="input" id="pName" value="${escapeHtml(p.name||'')}"></label>
      <label class="field"><span class="flabel">${T.projectLocation}</span>
        <input class="input" id="pLoc" value="${escapeHtml(p.location||'')}"></label>
      <label class="field"><span class="flabel">${T.projectClient}</span>
        <input class="input" id="pClient" value="${escapeHtml(p.client||'')}"></label>
      <label class="field"><span class="flabel">${T.projectStatus}</span>
        <select class="input" id="pStatus">
          <option value="active" ${p.status==='active'?'selected':''}>${T.active}</option>
          <option value="inactive" ${p.status==='inactive'?'selected':''}>${T.inactive}</option>
        </select></label>
      <label class="field"><span class="flabel">${T.projectNotes}</span>
        <textarea class="input" id="pNotes">${escapeHtml(p.notes||'')}</textarea></label>
    </div>
    <button class="btn btn-primary" id="saveProj">${T.save}</button>
  `;
}
async function mountAdminProjectEdit(params){
  document.getElementById('saveProj').onclick = async () => {
    const name = document.getElementById('pName').value.trim();
    if (!name){ toast(T.required, 'err'); return; }
    const data = {
      name,
      location: document.getElementById('pLoc').value.trim(),
      client: document.getElementById('pClient').value.trim(),
      status: document.getElementById('pStatus').value,
      notes: document.getElementById('pNotes').value.trim()
    };
    try{
      if (params.projectId){
        await updateProject(params.projectId, data);
      } else {
        const id = await createProject(data);
        state.currentProjectId = id;
      }
      await fetchProjects();
      toast(params.projectId ? T.save : T.projectCreated, 'ok');
      navigate('adminProjects');
    }catch(e){ console.error(e); toast(mapError(e),'err'); }
  };
}

/* ---------- 26. Admin: Machines ---------- */

  if (!isAdmin()) return `<div class="empty-state"><div class="t">${T.errPermission}</div></div>`;
  if (Object.keys(state.machines).length === 0) await fetchMachines();
  const list = Object.values(state.machines).filter(m => m.active !== false);
  return `
    <button class="btn btn-primary" id="newM" style="margin-bottom:var(--sp-4)">${T.newMachine}</button>
    <div class="card" style="padding:0 var(--sp-4)">
      ${list.map(m => `
        <button class="list-row tap" data-editm="${m.id}">
          <div class="main">
            <div class="title">${escapeHtml(m.model)} ${m.serial?'· '+escapeHtml(m.serial):''}</div>
            <div class="meta">${escapeHtml(state.projects[m.projectId]?.name||'')} · ${fmtNum(m.currentHours,1)}h · ${fmtBirr(m.rentalRate)}/h</div>
          </div>
          ${IC.chev}
        </button>
      `).join('') || `<div class="empty-state small">${T.dashNoRecords}</div>`}
    </div>

async function mountAdminMachines(){
  document.getElementById('newM').onclick = () => navigate('adminMachineEdit', { machineId: null });
  document.querySelectorAll('[data-editm]').forEach(b => b.onclick = () => navigate('adminMachineEdit', { machineId: b.dataset.editm }));
}
async function renderAdminMachineEdit(params){
  if (Object.keys(state.projects).length === 0) await fetchProjects();
  const m = params.machineId ? state.machines[params.machineId] : {
    model:'DX360LCA-7M', serial:'', projectId: state.currentProjectId || Object.keys(state.projects)[0] || '',
    currentHours:0, rentalRate:0, attachment:'standard', status:'active'
  };
  const projectOptions = Object.values(state.projects).map(p => `<option value="${p.id}" ${p.id===m.projectId?'selected':''}>${escapeHtml(p.name)}</option>`).join('');
  return `
    <div class="wizard-title">${params.machineId ? T.edit : T.newMachine}</div>
    <div class="card">
      <label class="field"><span class="flabel">${T.machineModel}</span>
        <input class="input" id="mModel" value="${escapeHtml(m.model||'DX360LCA-7M')}"></label>
      <label class="field"><span class="flabel">${T.machineSerial}</span>
        <input class="input" id="mSerial" value="${escapeHtml(m.serial||'')}"></label>
      <label class="field"><span class="flabel">${T.machineProject}</span>
        <select class="input" id="mProject">${projectOptions}</select></label>
      <label class="field"><span class="flabel">${T.machineHours}</span>
        <input class="input tnum" id="mHours" type="number" min="0" step="0.1" value="${m.currentHours||0}"></label>
      <label class="field"><span class="flabel">${T.machineRate}</span>
        <input class="input tnum" id="mRate" type="number" min="0" step="0.01" value="${m.rentalRate||0}"></label>
      <label class="field"><span class="flabel">${T.machineAttachment}</span>
        <select class="input" id="mAttach">
          <option value="standard" ${m.attachment==='standard'?'selected':''}>Standard Bucket</option>
          <option value="breaker" ${m.attachment==='breaker'?'selected':''}>Hydraulic Breaker</option>
          <option value="other" ${m.attachment==='other'?'selected':''}>Other</option>
        </select></label>
      <label class="field"><span class="flabel">${T.machineStatus}</span>
        <select class="input" id="mStatus">
          <option value="active" ${m.status==='active'?'selected':''}>${T.mStatActive}</option>
          <option value="idle" ${m.status==='idle'?'selected':''}>${T.mStatIdle}</option>
          <option value="down" ${m.status==='down'?'selected':''}>${T.mStatDown}</option>
          <option value="retired" ${m.status==='retired'?'selected':''}>${T.mStatRetired}</option>
        </select></label>
    </div>
    <button class="btn btn-primary" id="saveM">${T.save}</button>
  `;
}
async function mountAdminMachineEdit(params){
  document.getElementById('saveM').onclick = async () => {
    const data = {
      model: document.getElementById('mModel').value.trim() || 'DX360LCA-7M',
      serial: document.getElementById('mSerial').value.trim(),
      projectId: document.getElementById('mProject').value,
      currentHours: Number(document.getElementById('mHours').value)||0,
      rentalRate: Number(document.getElementById('mRate').value)||0,
      attachment: document.getElementById('mAttach').value,
      status: document.getElementById('mStatus').value
    };
    try{
      if (params.machineId){
        await updateMachine(params.machineId, data);
      } else {
        await createMachine(data);
      }
      await fetchMachines();
      toast(params.machineId ? T.save : T.machineCreated, 'ok');
      navigate('adminMachines');
    }catch(e){ console.error(e); toast(mapError(e),'err'); }
  };
}

/* ---------- 27. Admin: Users ---------- */
async function renderAdminUsers(){
  if (!isAdmin()) return `<div class="empty-state"><div class="t">${T.errPermission}</div></div>`;
  if (Object.keys(state.projects).length === 0) await fetchProjects();
  const users = await fetchUsers();
  const list = Object.values(users).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  return `
    <button class="btn btn-primary" id="newU" style="margin-bottom:var(--sp-4)">${T.newUser}</button>
    <div class="card" style="padding:0 var(--sp-4)">
      ${list.map(u => `
        <button class="list-row tap" data-edu="${u.id}">
          <div class="main">
            <div class="title">${escapeHtml(u.name||'')}</div>
            <div class="meta">${u.role==='admin'?T.roleAdmin:T.roleManager} · 0${escapeHtml(u.phone||'')} · ${u.active?T.active:T.inactive}</div>
          </div>
          ${IC.chev}
        </button>
      `).join('')}
    </div>
  `;
}
async function mountAdminUsers(){
  document.getElementById('newU').onclick = openCreateUserModal;
  document.querySelectorAll('[data-edu]').forEach(b => b.onclick = () => openEditUserModal(b.dataset.edu));
}
function openCreateUserModal(){
  if (Object.keys(state.projects).length === 0) fetchProjects();
  openModal(`
    <h3>${T.newUser}</h3>
    <label class="field"><span class="flabel">${T.userName}</span>
      <input class="input" id="uName"></label>
    <label class="field"><span class="flabel">${T.userPhone}</span>
      <input class="input tnum" id="uPhone" type="tel" inputmode="numeric" placeholder="09XXXXXXXX"></label>
    <label class="field"><span class="flabel">${T.userPassword}</span>
      <input class="input" id="uPass" type="text"></label>
    <label class="field"><span class="flabel">${T.userRole}</span>
      <select class="input" id="uRole">
        <option value="manager">${T.roleManager}</option>
        <option value="admin">${T.roleAdmin}</option>
      </select></label>
    <div class="field" id="uProjWrap">
      <span class="flabel">${T.userProjects}</span>
      ${Object.values(state.projects).map(p => `
        <label style="display:flex;align-items:center;gap:.5rem;padding:.35rem 0">
          <input type="checkbox" class="uProj" value="${p.id}">
          <span class="small">${escapeHtml(p.name)}</span>
        </label>
      `).join('')}
    </div>
    <div class="tiny muted" style="margin-bottom:var(--sp-4)">${T.tempPasswordNote}</div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="uCancel">${T.cancel}</button>
      <button class="btn btn-primary" id="uCreate">${T.createUser}</button>
    </div>
  `, el => {
    el.querySelector('#uCancel').onclick = closeModal;
    el.querySelector('#uRole').onchange = e => {
      el.querySelector('#uProjWrap').style.display = e.target.value==='admin' ? 'none' : 'block';
    };
    el.querySelector('#uCreate').onclick = async () => {
      const name = el.querySelector('#uName').value.trim();
      const phone = el.querySelector('#uPhone').value.trim();
      const pass = el.querySelector('#uPass').value;
      const role = el.querySelector('#uRole').value;
      const projects = Array.from(el.querySelectorAll('.uProj:checked')).map(c => c.value);
      if (!name || !isValidLocalPhone(phone)){ toast(T.required, 'err'); return; }
      if (pass.length < 6){ toast(T.invalidNumber, 'err'); return; }
      try{
        await adminCreateUser({ name, phone, password: pass, role, assignedProjects: role==='admin'?[]:projects });
        toast(T.userCreated, 'ok');
        closeModal();
        navigate('adminUsers');
      }catch(e){ console.error(e); toast(mapError(e),'err'); }
    };
  });
}
async function openEditUserModal(uid){
  const u = state.users[uid];
  if (!u){ toast('—','err'); return; }
  openModal(`
    <h3>${escapeHtml(u.name||'')}</h3>
    <label class="field"><span class="flabel">${T.userName}</span>
      <input class="input" id="euName" value="${escapeHtml(u.name||'')}"></label>
    <div class="toggle-row">
      <span>${T.userActive}</span>
      <label class="switch"><input type="checkbox" id="euActive" ${u.active?'checked':''}><span class="track"></span><span class="thumb"></span></label>
    </div>
    <label class="field" style="margin-top:var(--sp-3)"><span class="flabel">${T.userRole}</span>
      <select class="input" id="euRole">
        <option value="manager" ${u.role==='manager'?'selected':''}>${T.roleManager}</option>
        <option value="admin" ${u.role==='admin'?'selected':''}>${T.roleAdmin}</option>
      </select></label>
    <div class="field" id="euProjWrap">
      <span class="flabel">${T.userProjects}</span>
      ${Object.values(state.projects).map(p => `
        <label style="display:flex;align-items:center;gap:.5rem;padding:.35rem 0">
          <input type="checkbox" class="euProj" value="${p.id}" ${(u.assignedProjects||[]).includes(p.id)?'checked':''}>
          <span class="small">${escapeHtml(p.name)}</span>
        </label>
      `).join('')}
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="euCancel">${T.cancel}</button>
      <button class="btn btn-primary" id="euSave">${T.save}</button>
    </div>
  `, el => {
    el.querySelector('#euCancel').onclick = closeModal;
    el.querySelector('#euRole').onchange = e => {
      el.querySelector('#euProjWrap').style.display = e.target.value==='admin' ? 'none' : 'block';
    };
    if (u.role === 'admin') el.querySelector('#euProjWrap').style.display = 'none';
    el.querySelector('#euSave').onclick = async () => {
      const name = el.querySelector('#euName').value.trim();
      const active = el.querySelector('#euActive').checked;
      const role = el.querySelector('#euRole').value;
      const projects = Array.from(el.querySelectorAll('.euProj:checked')).map(c => c.value);
      try{
        if (active !== u.active) await setUserActive(uid, active);
        await updateUserProfile(uid, { name, role, assignedProjects: role==='admin'?[]:projects });
        await fetchUsers();
        toast(T.save, 'ok');
        closeModal();
        navigate('adminUsers');
      }catch(e){ console.error(e); toast(mapError(e),'err'); }
    };
  });
}

/* ---------- 28. Admin: Audit ---------- */
async function renderAdminAudit(){
  if (!isAdmin()) return `<div class="empty-state"><div class="t">${T.errPermission}</div></div>`;
  const q = query(collection(db,'auditLogs'), orderBy('serverTimestamp','desc'), fsLimit(80));
  const snap = await safeGetDocs(q);
  const rows = [];
  snap.forEach(d => rows.push({ id:d.id, ...d.data() }));
  return `
    <div class="section-title">${T.adminAudit}</div>
    <div class="card" style="padding:0 var(--sp-4)">
      ${rows.map(r => `
        <div class="list-row">
          <div class="main">
            <div class="title">${escapeHtml(r.action||'')}</div>
            <div class="meta">${escapeHtml(r.actorRole||'')} · ${r.projectId?escapeHtml(state.projects[r.projectId]?.name||''):''}</div>
          </div>
          <div class="tiny muted tnum">${r.clientTimestamp?new Date(r.clientTimestamp).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):''}</div>
        </div>
      `).join('') || `<div class="empty-state small">—</div>`}
    </div>
  `;
}
async function mountAdminAudit(){}

/* ---------- 29. Bootstrap ---------- */
ROOT.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center"><div class="login-mark">DX360 · Rental Ops</div></div>`;
initSyncMonitor();
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(e => console.warn('SW registration failed', e));
  });
}
subscribeAuth(async (isAuthed) => {
  if (!isAuthed){ navigate('login'); return; }
  try{
    await fetchProjects();
    await fetchMachines();
    if (isAdmin()) await fetchUsers();
  }catch(e){ console.error(e); }
  navigate('dashboard');
});
</script>
